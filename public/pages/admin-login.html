<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Access</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-head">
      <div class="login-logo">📊</div>
      <h1>Feedback Dashboard</h1>
      <p>Open Netlify Forms Dashboard</p>
    </div>

    <div class="card">

      <p style="text-align:center; margin-bottom:20px;">
        Feedback submissions are stored in Netlify Forms.
      </p>

      <a
        href="https://app.netlify.com/projects/feedbackcollectorsystem/forms"
        target="_blank"
        class="btn btn-primary btn-full"
        style="display:block;text-align:center;text-decoration:none;"
      >
        Open Dashboard →
      </a>

    </div>

    <p style="text-align:center; margin-top:18px;">
      <a href="/">← Back to Feedback Form</a>
    </p>

  </div>
</div>

</body>
</html>
